# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: SnackStreet
options:
  bundleIdPrefix: com.example.snackstreet
  deploymentTarget:
    iOS: "17.0"
packages:
  TycoonCore:
    path: Packages/TycoonCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SnackStreet:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: TycoonCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Snack Street
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.snackstreet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
schemes:
  SnackStreet:
    build:
      targets:
        SnackStreet: all
    test:
      targets: []
